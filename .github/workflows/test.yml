name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,docs]'
      - run: python -m black --check src tests examples tools docs/conf.py
      - run: python -m sphinx -W --keep-going -b html docs build/docs

  standalone:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Install the wheel, not an editable checkout
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel, = pathlib.Path('wheelhouse').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel), 'pyxel[app2exe]==3.0.0'], check=True)
      - run: python tools/check_bundle.py build/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-${{ matrix.os }}
          path: |
            build/standalone/metrics.json
            build/standalone/run-*.json
            build/standalone/relocated/
          if-no-files-found: ignore
